name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: macos-latest
            bundles: dmg
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            bundles: deb,appimage

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Z·SWITCH ${{ github.ref_name }}'
          releaseBody: |
            zcode-switch-plus：基于 [wjsqqj/zcode-switch](https://github.com/wjsqqj/zcode-switch)（其上游为 [pjpv/zcode-switch](https://github.com/pjpv/zcode-switch)）二次开发。

            ## 本版改动
            - 新增账号卡片「复制到 Magpie」按钮，一次复制站点、账号名称、API Key、JWT 和已有设备标识。
            - 配套 Magpie 插件自动识别完整账号信息，无需重复选择站点、填写备注或分别复制两种凭据。
            - 同时支持付费 GLM Coding Plan 与 ZCode Start Plan／赠送额度；已过期的 JWT 不影响仍可用的付费 key。
            - 补充导出／导入格式说明和两端兼容性测试，修复中英文检查对动态主题键的误报。

            ## 接入 Magpie
            1. 下载本页附件 `magpie-zcode-switch-auth-0.3.0.zip`，更新／安装配套插件。
            2. 在 zcode-switch-plus 目标账号卡片点击「复制到 Magpie」。
            3. 在 Magpie 添加 ZCode 账号，选择 `Switch Plus: Import account`，粘贴完整内容即可。

            ## 下载
            - **Windows**：`*_x64-setup.exe` 安装包／`*_portable.exe` 便携版
            - **macOS**：`*_aarch64.dmg`（Apple 芯片）／`*_x64.dmg`（Intel 芯片）
            - **Linux**：`*.deb`／`*.AppImage`
            - **Magpie 插件**：`magpie-zcode-switch-auth-0.3.0.zip`

            未签名：Windows SmartScreen 选「更多信息 → 仍要运行」；macOS 右键打开。
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.bundles }} ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload portable exe + checksums (windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/zcode-switch.exe" "zcode-switch_${VER}_portable.exe"
          SETUP=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          sha256sum "zcode-switch_${VER}_portable.exe" "$SETUP" | sed 's| .*/| |' > "checksums-Windows-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "zcode-switch_${VER}_portable.exe" "checksums-Windows-${GITHUB_REF_NAME}.txt" --clobber

      - name: Upload checksums
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TGT="${{ matrix.rust_target }}"
          [ -n "$TGT" ] || TGT="native"
          find src-tauri/target -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            | xargs sha256sum | sed 's| .*/| |' > "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt"
          gh release upload "$GITHUB_REF_NAME" "checksums-${RUNNER_OS}-${TGT}-${GITHUB_REF_NAME}.txt" --clobber